services:
  db:
    image: postgres:16
    container_name: wtf_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: wtf_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TZ}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUST_PROXY: ${TRUST_PROXY}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT}
      URLENCODED_BODY_LIMIT: ${URLENCODED_BODY_LIMIT}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      ANOMALY_CHECK_INTERVAL_MS: ${ANOMALY_CHECK_INTERVAL_MS}
      SIMULATOR_TICK_INTERVAL_MS: ${SIMULATOR_TICK_INTERVAL_MS}
      MATERIALIZED_VIEW_REFRESH_INTERVAL_MS: ${MATERIALIZED_VIEW_REFRESH_INTERVAL_MS}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: wtf_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT}
      API_BASE_URL_INTERNAL: http://backend:${BACKEND_PORT}
      NEXT_PUBLIC_STRICT_API: ${NEXT_PUBLIC_STRICT_API}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      TZ: ${TZ}
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  pg_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:
