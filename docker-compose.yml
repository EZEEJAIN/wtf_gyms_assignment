services:
  backend:
    build:
      context: ./backend
    container_name: wtf_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT}
      ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: wtf_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT}
      API_BASE_URL_INTERNAL: http://backend:${BACKEND_PORT}
      PORT: 3000
      TZ: ${TZ}
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  pg_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:
